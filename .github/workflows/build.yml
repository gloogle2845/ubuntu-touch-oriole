name: Build Halium pro Pixel 6

on:
  workflow_dispatch: # Spuštění ručně tlačítkem

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Instalace vývojářských nástrojů a moderních kompilátorů
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libtinfo5 python3 libncurses5-dev git-lfs jq libxml2-utils rsync
          # Instalace LLVM/Clang, které Pixel 6 kernel vyžaduje ke kompilaci
          sudo apt-get install -y clang lld llvm

      - name: Stažení zdrojového kódu kernelu Pixel 6
        run: |
          git clone --depth=1 -b lineage-20 https://github.com kernel

      - name: Stažení Halium nástrojů
        run: |
          # Opravený přímý zápis adresy pro hybris-boot
          git clone --depth=1 https://github.com halium-boot

      - name: Kompilace samostatného Linuxového Jádra
        run: |
          cd kernel
          
          # Nastavení prostředí pro kompilaci pomocí moderního Clang (LLVM)
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          echo "Konfiguruji kernel pro Pixel 6..."
          make gki_defconfig
          
          echo "Spouštím samotnou kompilaci jádra..."
          make -j$(nproc) Image.lz4 || make -j$(nproc) Image

      - name: Nahrání hotového jádra (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: pixel6-kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/Image.lz4
