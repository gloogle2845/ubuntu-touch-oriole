name: Generating Boot Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Priprava systemu a nastroju pro boot.img
        run: |
          sudo apt-get update 
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libtinfo5 python3 libncurses5-dev git-lfs jq libxml2-utils rsync clang lld llvm libssl-dev gcc-aarch64-linux-gnu libelf-dev dwarves

      - name: Vytvoreni SWAP pameti v cloudu proti Error 137
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Stahování zdrojových kódů pres GitHub Checkout
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_gs101
          ref: lineage-20
          path: kernel

      - name: Konfigurace a stavba jadra
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          make gki_defconfig
          
          # Vypnuti LTO pro usporu pameti
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_NONE=y/' .config
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/CONFIG_LTO_NONE=y/' .config
          sed -i '/CONFIG_LTO_CLANG/d' .config
          echo "CONFIG_LTO_NONE=y" >> .config
          
          # Vypnuti BTF chyb
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/' .config
          sed -i '/CONFIG_DEBUG_INFO_BTF/d' .config
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          
          make olddefconfig
          make -j2 Image

      - name: Automaticke vyvoreni mkbootimg a baleni do platneho boot.img
        run: |
          mkdir output
          
          # Vytvoříme minimalistický nativní Python skript pro zabalení GKI v4 obrazu přímo z textu
          cat << 'EOF' > mkbootimg.py
          import os
          import sys
          import struct

          def pad_file(f, padding):
              pad = (padding - (f.tell() % padding)) % padding
              f.write(b'\0' * pad)

          def main():
              kernel_path = 'kernel/arch/arm64/boot/Image'
              output_path = 'output/boot.img'
              
              if not os.path.exists(kernel_path):
                  print("Chyba: Kernel Image neexistuje!")
                  sys.exit(1)
                  
              kernel_size = os.path.getsize(kernel_path)
              page_size = 4096
              
              with open(output_path, 'wb') as out:
                  # Android Boot Header v4 (GKI Standard)
                  # Magic (8B), Kernel Size (4B), Kernel Addr (4B), Ramdisk Size (4B), Ramdisk Addr (4B)
                  header = struct.pack('<8sIIII', b'ANDROID!', kernel_size, 0x00080000, 0, 0x01100000)
                  # Zbytek prázdné hlavičky v4 (celkem 1584 bajtů pro verzi 4)
                  header += b'\0' * (1584 - len(header))
                  # Přidáme Header Version = 4
                  header = header[:40] + struct.pack('<I', 4) + header[44:]
                  
                  out.write(header)
                  pad_file(out, page_size)
                  
                  with open(kernel_path, 'rb') as k:
                      out.write(k.read())
                  pad_file(out, page_size)
                  
              print("Uspesne zabaleno do boot.img s verzi hlavicky v4!")

          if __name__ == '__main__':
              main()
          EOF

          python3 mkbootimg.py

      - name: Nahrání hotoveho obrazu ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: Generating Boot Image
          path: output/boot.img
