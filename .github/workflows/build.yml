name: Generating Boot Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Priprava systemu a nastroju pro boot.img
        run: |
          sudo apt-get update 
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libtinfo5 python3 libncurses5-dev git-lfs jq libxml2-utils rsync clang lld llvm libssl-dev gcc-aarch64-linux-gnu libelf-dev dwarves
          sudo apt-get install -y abootimg

      - name: Vytvoreni SWAP pameti v cloudu proti Error 137
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Stahování zdrojových kódů pres GitHub Checkout
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_gs101
          ref: lineage-20
          path: kernel

      - name: Konfigurace a stavba jadra
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          make gki_defconfig
          
          # Vypnuti LTO pro usporu pameti
          sed -i 's/CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_NONE=y/' .config
          sed -i 's/CONFIG_LTO_CLANG_THIN=y/CONFIG_LTO_NONE=y/' .config
          sed -i '/CONFIG_LTO_CLANG/d' .config
          echo "CONFIG_LTO_NONE=y" >> .config
          
          # Vypnuti BTF chyb
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/' .config
          sed -i '/CONFIG_DEBUG_INFO_BTF/d' .config
          echo "CONFIG_DEBUG_INFO_BTF=n" >> .config
          
          make olddefconfig
          make -j2 Image

      - name: Automaticke stazeni mkbootimg a baleni do platneho boot.img
        run: |
          mkdir output
          
          # Bezpecne stazeni oficialniho skriptu od Google bez orezavani adresy
          curl -sL https://googlesource.com | base64 --decode > mkbootimg.py
          chmod +x mkbootimg.py
          
          echo "Balím jádro do formátu boot.img s Android Boot Magic záhlavím..."
          python3 mkbootimg.py \
            --kernel kernel/arch/arm64/boot/Image \
            --header_version 4 \
            --output output/boot.img
          
          echo "Hotovo! Soubor boot.img je připraven."

      - name: Nahrání hotoveho obrazu ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: Generating Boot Image
          path: output/boot.img
