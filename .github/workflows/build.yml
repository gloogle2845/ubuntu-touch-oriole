name: Build Halium pro Pixel 6

on:
  workflow_dispatch: # Spuštění ručně tlačítkem

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Instalace vývojářských nástrojů a ARM kompilátorů
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libtinfo5 python3 libncurses5-dev git-lfs jq libxml2-utils rsync gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Stažení zdrojového kódu kernelu Pixel 6
        run: |
          # Použijeme oficiální a ověřenou větev lineage-20 pro Google Tensor GS101
          git clone --depth=1 -b lineage-20 https://github.com/LineageOS/android_kernel_google_gs101 kernel

      - name: Stažení Halium nástrojů
        run: |
          git clone --depth=1 -b halium-11.0 https://github.com halium-boot

      - name: Kompilace samostatného Linuxového Jádra
        run: |
          cd kernel
          
          # Nastavení prostředí pro křížovou kompilaci na ARM64
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Konfiguruji kernel pro Pixel 6..."
          # Generování výchozí konfigurace pro Google Tensor architekturu
          make gki_defconfig
          
          echo "Spouštím samotnou kompilaci jádra..."
          # Spustíme samotný build linuxového jádra
          make -j$(nproc) Image.lz4 || make -j$(nproc) Image

      - name: Nahrání hotového jádra (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: pixel6-kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/Image.lz4
