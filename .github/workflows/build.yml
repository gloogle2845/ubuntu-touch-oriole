nname: Build Halium Pixel 6 Final

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Prvni krok instalace
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libtinfo5 python3 libncurses5-dev git-lfs jq libxml2-utils rsync clang lld llvm

      - name: Stazeni kernelu na jednom radku
        run: git clone --depth=1 -b lineage-20 https://github.com kernel

      - name: Stazeni halium boot
        run: git clone --depth=1 https://github.com halium-boot

      - name: Kompilace jadra
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make arch/arm64/configs/gki_defconfig
          make -j$(nproc) Image
